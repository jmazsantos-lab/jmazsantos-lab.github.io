<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body, p, li, a {
    font-family: "IBM Plex Sans", sans-serif !important;
  }
  h1, h2, h3, h4, h5, h6,
  .page__title, .archive__item-title {
    font-family: "Spectral", serif !important;
  }

  body, a, button {
    cursor: url('/assets/images/cursor-hop.png') 16 16, auto;
  }

  /* Pink theme */
  body {
    background-color: #fff0f7;
  }
  a {
    color: #db2777;
  }
  a:hover {
    color: #9d174d;
  }
  .masthead,
  .masthead__inner-wrap,
  .greedy-nav,
  .greedy-nav .visible-links {
    background-color: #fdf2f8 !important;
    border-bottom-color: #f9a8d4 !important;
  }
  .greedy-nav a,
  .site-title,
  .site-title a {
    color: #9d174d !important;
  }
  .greedy-nav a:hover {
    color: #db2777 !important;
  }
  .btn--primary,
  .btn--success {
    background-color: #ec4899 !important;
  }
  .btn--primary:hover,
  .btn--success:hover {
    background-color: #be185d !important;
  }
  .page__title,
  .archive__item-title a,
  .archive__item-title {
    color: #9d174d !important;
  }
  blockquote {
    border-left-color: #f472b6 !important;
  }
  .page__hero--overlay {
    background-color: #db2777 !important;
  }

  .tool-card {
    background: #fdf2f8;
    border: 1px solid #f9a8d4;
    border-radius: 12px;
    padding: 1.5em 1.75em;
    margin: 2em 0;
  }
  .tool-card h2 {
    margin-top: 0;
  }
  .tool-card--placeholder {
    color: #6b6b6b;
    text-align: center;
  }

  .post-engagement {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 0 0 1.5em;
    font-size: 0.9em;
    color: #6b6b6b;
  }
  .post-engagement .post-views {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
  }
  .post-engagement .post-like-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    background: transparent;
    border: 1px solid #c9c9c9;
    border-radius: 999px;
    padding: 0.3em 0.9em;
    font-size: 1em;
    color: #6b6b6b;
    transition: all 0.15s ease;
  }
  .post-engagement .post-like-btn:not(:disabled):hover {
    border-color: #db2777;
    color: #db2777;
  }
  .post-engagement .post-like-btn.liked {
    background: #fce7f3;
    border-color: #db2777;
    color: #9d174d;
  }
  .post-engagement .post-like-btn:disabled {
    cursor: default;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.page__content');
    var isPost = /\/\d{4}\/\d{2}\/\d{2}\//.test(location.pathname);
    if (!content || !isPost) return;

    var namespace = 'jmazsantos-lab-github-io';
    var segments = location.pathname.split('/').filter(Boolean);
    var slug = segments.length ? segments[segments.length - 1].replace(/\.html?$/, '') : 'home';
    var key = encodeURIComponent(slug);

    var widget = document.createElement('div');
    widget.className = 'post-engagement';
    widget.innerHTML =
      '<span class="post-views"><i class="fas fa-fw fa-eye" aria-hidden="true"></i><span id="pv-count">&hellip;</span> views</span>' +
      '<button type="button" id="pv-like-btn" class="post-like-btn"><i class="fas fa-fw fa-seedling" aria-hidden="true"></i><span id="pv-like-count">&hellip;</span></button>';
    content.parentNode.insertBefore(widget, content);

    fetch('https://abacus.jasoncameron.dev/hit/' + namespace + '/views-' + key)
      .then(function (r) { return r.json(); })
      .then(function (d) { document.getElementById('pv-count').textContent = d.value; })
      .catch(function () { document.getElementById('pv-count').textContent = '–'; });

    var likeStorageKey = 'liked-' + key;
    var likeBtn = document.getElementById('pv-like-btn');
    var likeCountEl = document.getElementById('pv-like-count');
    var alreadyLiked = localStorage.getItem(likeStorageKey) === '1';

    fetch('https://abacus.jasoncameron.dev/get/' + namespace + '/likes-' + key)
      .then(function (r) { return r.json(); })
      .then(function (d) { likeCountEl.textContent = d.value; })
      .catch(function () { likeCountEl.textContent = '0'; });

    if (alreadyLiked) {
      likeBtn.classList.add('liked');
      likeBtn.disabled = true;
    }

    likeBtn.addEventListener('click', function () {
      if (localStorage.getItem(likeStorageKey) === '1') return;
      fetch('https://abacus.jasoncameron.dev/hit/' + namespace + '/likes-' + key)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          likeCountEl.textContent = d.value;
          localStorage.setItem(likeStorageKey, '1');
          likeBtn.classList.add('liked');
          likeBtn.disabled = true;
        });
    });
  });
</script>
