position_en: "I run FMCG manufacturing operations &mdash; brewing, packaging, continuous improvement &mdash; and I write about how the work actually gets done."
position_es: "Dirijo operaciones de fabricaci&oacute;n en FMCG &mdash; cervecer&iacute;a, envasado, mejora continua &mdash; y escribo sobre c&oacute;mo se hace el trabajo de verdad."
intro_en: "I&rsquo;ve started up a plant, run a 90-person site and delivered a &pound;6M new-product programme. This is where I think out loud about operations, and share the tools I build with AI for routine factory work."
intro_es: "He arrancado una planta, dirigido un sitio de 90 personas y entregado un programa de nuevos productos de 6M&nbsp;&pound;. Aqu&iacute; pienso en voz alta sobre operaciones y comparto las herramientas que construyo con IA para el trabajo rutinario de f&aacute;brica."
