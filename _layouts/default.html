<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% feed_meta %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f6f3ea'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' font-family='Georgia,serif' fill='%237c3a2e'%3EJ%3C/text%3E%3C/svg%3E">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ content }}
  {% include footer.html %}
  <script>
  (function () {
    var KEY = 'jz-lang';
    function apply(l) {
      document.documentElement.lang = l;
      document.querySelectorAll('[data-es]').forEach(function (el) {
        if (el.dataset.en === undefined) el.dataset.en = el.innerHTML;
        el.innerHTML = (l === 'es') ? el.dataset.es : el.dataset.en;
      });
      document.querySelectorAll('.nav__lang button').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.l === l ? 'true' : 'false');
      });
      try { localStorage.setItem(KEY, l); } catch (e) {}
    }
    var saved = 'en';
    try { saved = localStorage.getItem(KEY) || 'en'; } catch (e) {}
    document.querySelectorAll('.nav__lang button').forEach(function (b) {
      b.addEventListener('click', function () { apply(b.dataset.l); });
    });
    if (saved === 'es') apply('es');
    else document.querySelectorAll('.nav__lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.l === 'en' ? 'true' : 'false');
    });
  })();
  </script>
</body>
</html>
